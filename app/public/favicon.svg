<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Smoked Obsidian Tile Gradient -->
    <linearGradient id="og-tile-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e2b" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>

    <!-- Left O-Ring: Vibrant Electric Cyan / Aqua Glow -->
    <linearGradient id="og-cyan-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#00f5ff" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Right G-Ring: Deep Radiant Azure / Cobalt Blue -->
    <linearGradient id="og-azure-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="45%" stop-color="#3b82f6" />
      <stop offset="85%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Center Token Metal Gradient -->
    <linearGradient id="og-token-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- 1. Squircle Ceramic Baseplate & Ambient Rim -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" fill="url(#og-tile-grad)" stroke="#1e2d42" stroke-width="0.8" />
  <rect x="2.5" y="2.5" width="27" height="27" rx="6.8" fill="none" stroke="rgba(56,189,248,0.18)" stroke-width="0.5" />

  <!-- 2. Left O-Ring: Fully Saturated Electric Cyan Glass Ring -->
  <circle cx="11.8" cy="16" r="5.7" stroke="url(#og-cyan-ring)" stroke-width="2.8" fill="none" />
  <circle cx="11.8" cy="16" r="5.7" stroke="#ffffff" stroke-width="0.55" stroke-opacity="0.6" fill="none" />

  <!-- 3. Right G-Ring: Fully Saturated Deep Azure Cobalt Glass Ring -->
  <path
    d="M 23.3 12.2 A 5.7 5.7 0 1 0 24.2 18.5 L 18.5 18.5"
    stroke="url(#og-azure-ring)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <path
    d="M 23.3 12.2 A 5.7 5.7 0 1 0 24.2 18.5 L 18.5 18.5"
    stroke="#ffffff"
    stroke-width="0.55"
    stroke-opacity="0.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- 4. Center Git Commit Nexus Token -->
  <circle cx="15.8" cy="16" r="3.2" fill="url(#og-token-grad)" stroke="#3b82f6" stroke-width="0.6" />
  <path d="M 15.8 18.2 V 14.5 M 15.8 16.5 C 16.6 16.5 17.5 15.8 17.5 14.8" stroke="#ffffff" stroke-width="0.75" stroke-linecap="round" />
  <circle cx="15.8" cy="14" r="0.65" fill="#00f5ff" stroke="#ffffff" stroke-width="0.3" />
  <circle cx="17.5" cy="14.8" r="0.65" fill="#00f5ff" stroke="#ffffff" stroke-width="0.3" />
  <circle cx="15.8" cy="18.2" r="0.65" fill="#00f5ff" stroke="#ffffff" stroke-width="0.3" />
</svg>