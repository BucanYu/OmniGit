<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="50%" stop-color="#121316" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5" />
    </linearGradient>

    <!-- O Letter Gradient (Cyan to Indigo) -->
    <linearGradient id="oGrad" x1="0%" y1="30%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#4facfe" />
      <stop offset="80%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- G Letter Gradient (Indigo to Purple to Fuchsia) -->
    <linearGradient id="gGrad" x1="0%" y1="20%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Git Branch Line Gradient -->
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#softShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="none" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Subtle Radial Ambient Light inside Squircle -->
  <radialGradient id="ambientLight" cx="50%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
    <stop offset="60%" stop-color="#a855f7" stop-opacity="0.04" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0" />
  </radialGradient>
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#ambientLight)" />

  <!-- Inner Monogram Group with Glow -->
  <g filter="url(#glow)">
    <!-- O Letter (Left Ring / Arc) -->
    <circle cx="206" cy="256" r="92" fill="none" stroke="url(#oGrad)" stroke-width="38" stroke-linecap="round" />

    <!-- G Letter (Right Ring + Inward Crossbar) -->
    <path d="M 368 188 A 92 92 0 1 0 398 256 L 290 256" fill="none" stroke="url(#gGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Git Branching Fork Node: Connecting G inward bar to branch node -->
    <path d="M 290 256 Q 256 256, 256 310 L 256 320" fill="none" stroke="url(#gitGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Git Commit Nodes (Luminous glowing circles) -->
    <circle cx="290" cy="256" r="14" fill="#ffffff" stroke="#38bdf8" stroke-width="6" />
    <circle cx="256" cy="326" r="11" fill="#ec4899" stroke="#ffffff" stroke-width="4" />
    <circle cx="256" cy="186" r="11" fill="#00f2fe" stroke="#ffffff" stroke-width="4" />

    <!-- Git branch connector curve top -->
    <path d="M 256 186 Q 256 230, 290 256" fill="none" stroke="url(#oGrad)" stroke-width="8" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
