name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install Dependencies
        working-directory: app
        run: npm ci || npm install

      - name: Build Application
        working-directory: app
        run: npm run build:all

      - name: Package Windows Standalone
        working-directory: app
        run: node scripts/package.cjs

      - name: Compile NSIS Installer
        shell: cmd
        run: |
          for /f "tokens=*" %%a in ('powershell -NoProfile -Command "(Get-Content -Raw -Path 'app\package.json' | ConvertFrom-Json).version"') do set "PRODUCT_VERSION=%%a"
          scripts\tools\nsis\makensis.exe /DPRODUCT_VERSION="%PRODUCT_VERSION%" scripts\installer.nsi

      - name: Upload Release Binaries to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/release/OmniGit-Setup-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
